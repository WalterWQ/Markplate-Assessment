name: Build & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore workloads
        run: dotnet workload restore ./code/StarterApp/StarterApp/StarterApp.csproj

      - name: Restore dependencies
        run: dotnet restore ./code/StarterApp/StarterApp.sln

      - name: Build
        run: dotnet build ./code/StarterApp/StarterApp.sln --configuration Release --no-restore
        
      - name: Run tests
        run: dotnet test ./RentalApp.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: '**/coverage.cobertura.xml'
          token: ${{ secrets.CODECOV_TOKEN }}
